# QKD Explainable Anomaly Detection Configuration
# Protocol: BB84 with Decoy/Discrete Block Sifting & Noise Modeling

simulation:
  random_seed: 42
  raw_photons_per_block: 1024       # M: Number of raw transmitted photon states per block
  expected_sifted_bits: 512         # N approx M/2 after basis reconciliation
  blocks_per_session: 200           # B: Total sequential transmission blocks per session
  attack_start_block: 101           # T_attack: Block index where Eve becomes active (1-indexed)
  
physics:
  baseline_qber: 0.03               # e_0: Stationary fiber background noise (3%)
  abort_qber_threshold: 0.11        # Static 11% BB84 theoretical threshold
  scintillation_std: 0.30           # Stationary std of AR(1) log-QBER (was 0.008: QBER std 0.0002, below the
                                    # ~0.0075 binomial noise of a 512-bit block, so the channel shift was invisible)
  scintillation_ar1_phi: 0.75       # Temporal correlation parameter for atmospheric turbulence
  
classes:
  class_0_benign:
    name: "Benign Noise"
    p_eve: 0.0
  class_1_full_ir:
    name: "Full Intercept-Resend"
    p_eve: 1.0
  class_2_fractional_ir:
    name: "Fractional Intercept-Resend"
    p_eve_min: 0.10
    p_eve_max: 0.30

features:
  window_size: 10                   # W: Backward-looking causal sliding window (blocks)
  ema_span: 5                       # Span for exponential moving average

models:
  hoeffding:
    alpha: 0.01                     # Confidence significance (target FPR <= 1%)
  random_forest:
    n_estimators: 150
    max_depth: 8
    random_state: 42
    n_jobs: -1
  xgboost:
    n_estimators: 150
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    eval_metric: "logloss"

benchmarks:
  num_sessions_train: 1200          # 400 per class for training
  num_sessions_val: 300             # 100 per class for validation & threshold tuning
  num_sessions_test: 600            # 200 per class for testing
  latency_eval_sessions: 500        # Dedicated sessions for empirical latency Delta_T evaluation
  latency_p_eve_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 1.0]

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  figures: "results/figures"
  metrics: "results/metrics"

# Modern protocol: Sending-or-Not-Sending Twin-Field QKD (scripts/05_modern_qkd_tfqkd.py)
tf_qkd:
  channel:
    alpha_db_per_km: 0.2            # Standard fiber attenuation
    eta_det: 0.6                    # Charlie's detector efficiency
    p_dark: 1.0e-8                  # Dark-count probability per pulse
    phase_noise_rad: 0.35           # Residual phase error after compensation (~3.3% X error)
    phase_slices: 16                # M phase slices for X-window phase matching
    f_ec: 1.1                       # Error-correction inefficiency
  bb84_misalignment: 0.015          # e_d for the decoy-state BB84 comparison curve
  time_series:
    distance_km: 200
    intensities: {eps: 0.05, mu_z: 0.45, mu_1: 0.08, mu_2: 0.30}
    z_pairs_per_block: 2.0e+7       # ~5,400 Z-window events per block at 200 km
    x_pairs_per_block: 5.0e+6       # ~4,800 phase-matched X events per block
    phase_drift_std: 0.15           # AR(1) log-drift of the residual phase noise
    phase_drift_phi: 0.8
    blocks_per_session: 200
    attack_start_block: 101
    p_eve_range: [0.02, 0.15]       # Fraction of pulses whose phase Eve scrambles
    train_sessions: 400
    val_sessions: 100
    latency_p_eve_grid: [0.02, 0.05, 0.10, 0.15]
    latency_sessions_per_p: 40
    trace_p_eve: 0.05


# Phase 2: Multi-Attack Classification (5 Classes, 63 Physics Features)
multiattack:
  classes:
    0: "Normal Channel"
    1: "Fractional Intercept-Resend"
    2: "Photon Number Splitting"
    3: "Fake State Blinding"
    4: "Time-Shift"
  window_size: 50
  ema_span: 10
  sessions_per_class: 1000          # 5,000 sessions total (~500k feature rows)
  blocks_per_session: 150
  attack_start_block: 76
  raw_photons_per_block: 1024
  train_split: 0.80
  random_seed: 42
  xgboost:
    n_estimators: 250
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.85
    colsample_bytree: 0.80
    random_state: 42
