name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests (physics checks fail the build)
        run: python -m pytest -q
      - name: Smoke dataset generation
        run: python scripts/06_generate_multiattack_dataset.py --smoke --out-dir data/processed/smoke
      - name: Smoke multi-seed evaluation
        run: python scripts/10_multiseed_evaluation.py --seeds 1 2 --sessions-per-class 6 --heldout-sessions-per-class 3 --svm-max-rows 1500 --models xgb rf --tag smoke
      - name: Upload smoke artefacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.python-version }}
          path: data/processed/smoke/*.meta.json
