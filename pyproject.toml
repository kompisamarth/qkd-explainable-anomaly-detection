[project]
name = "qkd-dashboard"
version = "3.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.1.3",
    "scipy==1.18.1",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
    "joblib==1.6.0",
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
    "xgboost-cpu==3.4.1; sys_platform == 'linux'",
    "xgboost==3.4.1; sys_platform != 'linux'",
]
